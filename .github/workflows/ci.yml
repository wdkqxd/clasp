name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "the following files are not gofmt-ed:"
            echo "$files"
            exit 1
          fi

      - name: lint
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: check
        run: pnpm check

      - name: build
        run: pnpm build
