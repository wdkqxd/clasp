name: Feature request
description: Suggest an idea or improvement
title: "[feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Explain the problem first, then the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is missing or inconvenient right now?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search
        - Images
        - Autocomplete
        - Wikipedia
        - API
        - UI / settings
        - Self-hosting
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
